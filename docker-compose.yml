version: '3.8'

services:
  # ===================================================================
  # Service 1: MinIO (S3 Compatible Object Storage)
  # ===================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: mini_cloud_minio
    ports:
      - "9000:9000"   # S3 API Endpoint
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: mock_access_key
      MINIO_ROOT_PASSWORD: mock_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================================================================
  # Service 2: DynamoDB Local (NoSQL Database)
  # ===================================================================
  dynamodb-local:
    image: amazon/dynamodb-local:2.2.1
    container_name: mini_cloud_dynamodb
    ports:
      - "8000:8000"   # DynamoDB API Endpoint
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  # ===================================================================
  # Service 3: LocalStack (Alternative Unified S3 + DynamoDB Service)
  # Uncomment the service below if you prefer LocalStack over MinIO+DynamoDB Local:
  # ===================================================================
  # localstack:
  #   image: localstack/localstack:latest
  #   container_name: mini_cloud_localstack
  #   ports:
  #     - "4566:4566"            # LocalStack Gateway Port
  #     - "4510-4559:4510-4559"  # External service port range
  #   environment:
  #     - SERVICES=s3,dynamodb
  #     - DEBUG=1
  #     - DOCKER_HOST=unix:///var/run/docker.sock
  #   volumes:
  #     - localstack_data:/var/lib/localstack

volumes:
  minio_data:
  dynamodb_data:
  # localstack_data:
